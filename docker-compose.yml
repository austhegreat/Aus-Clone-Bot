version: '3.8'

services:
  app:
    build: .
    container_name: aus-clone-bot-app
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - BASE_URL=http://localhost:3000
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHANNEL_URL=${TELEGRAM_CHANNEL_URL:-https://t.me/aus_updates}
      - DEFAULT_REGION=Australia (AU)
      - DEFAULT_PLAN=Premium Ultra HD (4K)
      - SESSION_DURATION_HOURS=48
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/aus_clone_bot
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    container_name: aus-clone-bot-db
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=aus_clone_bot
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"

volumes:
  postgres_data:
